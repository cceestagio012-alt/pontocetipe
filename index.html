<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0D1B35" />
  <title>CETIPE — Registro de Ponto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-top:       #0D1B35;
      --bg-bot:       #162848;
      --card-bg:      rgba(255,255,255,0.06);
      --card-border:  rgba(255,255,255,0.10);
      --entrada:      #22C55E;
      --entrada-dk:   #16A34A;
      --saida:        #EF4444;
      --saida-dk:     #DC2626;
      --blue:         #3B82F6;
      --text:         #F0F6FF;
      --muted:        #8EAAC8;
      --input-bg:     rgba(255,255,255,0.07);
      --input-border: rgba(255,255,255,0.14);
      --radius:       16px;
      --radius-sm:    10px;
    }

    html, body {
      min-height: 100%;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bot) 100%);
      background-attachment: fixed;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 48px;
      min-height: 100dvh;
    }

    /* ── Header ─────────────────────────────────────── */
    .header {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 24px 20px;
      gap: 10px;
    }

    .logo-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .school-name { text-align: center; }

    .school-name h1 {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.2px;
      line-height: 1.3;
    }

    .school-name p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
      font-weight: 500;
    }

    .date-badge {
      background: rgba(59,130,246,0.18);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 600;
      color: #93C5FD;
      letter-spacing: 0.2px;
    }

    /* ── Card ───────────────────────────────────────── */
    .card {
      width: calc(100% - 32px);
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    /* ── Toggle ─────────────────────────────────────── */
    .toggle-wrap {
      display: flex;
      background: rgba(0,0,0,0.25);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .toggle-btn {
      flex: 1;
      padding: 11px 8px;
      border: none;
      border-radius: 9px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all .25s ease;
      background: transparent;
      color: var(--muted);
      letter-spacing: 0.2px;
    }

    .toggle-btn.active-entrada {
      background: var(--entrada);
      color: white;
      box-shadow: 0 4px 16px rgba(34,197,94,0.35);
    }

    .toggle-btn.active-saida {
      background: var(--saida);
      color: white;
      box-shadow: 0 4px 16px rgba(239,68,68,0.35);
    }

    /* ── Fields ─────────────────────────────────────── */
    .field-group { display: flex; flex-direction: column; gap: 16px; }

    .field { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .input-wrap { position: relative; }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      pointer-events: none;
      opacity: 0.7;
    }

    input, select {
      width: 100%;
      padding: 13px 14px 13px 42px;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 500;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color .2s, background .2s, box-shadow .2s;
    }

    input::placeholder { color: rgba(255,255,255,0.28); font-weight: 400; }

    input:focus, select:focus {
      border-color: var(--blue);
      background: rgba(59,130,246,0.08);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }

    select option { background: #1A2F5A; color: var(--text); }

    .select-arrow {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--muted);
      font-size: 12px;
    }

    select:disabled { opacity: 0.5; }

    /* ── Horário row ─────────────────────────────────── */
    .hora-row { display: flex; gap: 10px; align-items: flex-end; }
    .hora-row .field { flex: 1; }

    .btn-agora {
      padding: 13px 16px;
      background: rgba(59,130,246,0.18);
      border: 1.5px solid rgba(59,130,246,0.3);
      border-radius: var(--radius-sm);
      color: #93C5FD;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s;
      letter-spacing: 0.2px;
      flex-shrink: 0;
    }

    .btn-agora:active { background: rgba(59,130,246,0.3); transform: scale(0.97); }

    /* ── Submit ──────────────────────────────────────── */
    .btn-submit {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.2px;
      transition: all .2s;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .btn-submit.entrada {
      background: linear-gradient(135deg, var(--entrada), var(--entrada-dk));
      color: white;
      box-shadow: 0 6px 20px rgba(34,197,94,0.35);
    }

    .btn-submit.saida {
      background: linear-gradient(135deg, var(--saida), var(--saida-dk));
      color: white;
      box-shadow: 0 6px 20px rgba(239,68,68,0.35);
    }

    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── Loader spinner ──────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Banners ─────────────────────────────────────── */
    .banner {
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;
      margin-top: 8px;
      display: none;
    }

    .banner.show { display: block; }

    .banner.error {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #FCA5A5;
    }

    .banner.warning {
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.3);
      color: #FCD34D;
    }

    /* ── Divider ─────────────────────────────────────── */
    .divider { height: 1px; background: rgba(255,255,255,0.08); margin: 20px 0; }

    .tip {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
      margin-top: 4px;
    }

    /* ── Overlay de sucesso ──────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(13,27,53,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s ease;
      padding: 32px;
    }

    .overlay.show { opacity: 1; pointer-events: all; }

    .success-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin-bottom: 24px;
      transform: scale(0.5);
      transition: transform .5s cubic-bezier(0.34,1.56,0.64,1);
    }

    .overlay.show .success-circle { transform: scale(1); }

    .success-circle.c-entrada {
      background: linear-gradient(135deg, rgba(34,197,94,0.3), rgba(22,163,74,0.15));
      border: 3px solid var(--entrada);
      box-shadow: 0 0 60px rgba(34,197,94,0.3);
    }

    .success-circle.c-saida {
      background: linear-gradient(135deg, rgba(239,68,68,0.3), rgba(220,38,38,0.15));
      border: 3px solid var(--saida);
      box-shadow: 0 0 60px rgba(239,68,68,0.3);
    }

    .success-title {
      font-size: 26px;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 8px;
      text-align: center;
    }

    .success-sub {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
      margin-bottom: 32px;
      max-width: 300px;
    }

    .success-sub strong { color: var(--text); }

    .btn-novo {
      padding: 14px 40px;
      background: rgba(255,255,255,0.1);
      border: 1.5px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
    }

    .btn-novo:active { background: rgba(255,255,255,0.18); transform: scale(0.97); }

    /* ── Ripple ──────────────────────────────────────── */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      transform: scale(0);
      animation: ripple-anim .5s linear;
      pointer-events: none;
    }

    @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

    /* ── Footer ──────────────────────────────────────── */
    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: rgba(142,170,200,0.45);
      text-align: center;
    }
  </style>
</head>

<body>

  <!-- ── Header ───────────────────────────────────────── -->
  <div class="header">
    <div class="logo-wrap">
      <img src="assets/logo.png" alt="Logo" onerror="this.parentElement.innerHTML='🏫'" />
    </div>
    <div class="school-name">
      <h1>Colégio Estadual do Tempo Integral</h1>
      <p>Padre Francisco Gonçalves de Souza</p>
    </div>
    <div class="date-badge" id="dataBadge">...</div>
  </div>

  <!-- ── Card ─────────────────────────────────────────── -->
  <div class="card">

    <div class="toggle-wrap">
      <button class="toggle-btn active-entrada" id="btnEntrada" onclick="setTipo('entrada')">
        ✅ &nbsp;ENTRADA
      </button>
      <button class="toggle-btn" id="btnSaida" onclick="setTipo('saida')">
        🚪 &nbsp;SAÍDA
      </button>
    </div>

    <div class="field-group">

      <div class="field">
        <label for="responsavel">Responsável pelo preenchimento</label>
        <div class="input-wrap">
          <span class="input-icon">✏️</span>
          <select id="responsavel" onchange="toggleResponsavelOutro()">
            <option value="">Selecione o responsável...</option>
            <option value="Daniela">Daniela</option>
            <option value="Guto">Guto</option>
            <option value="Hailan">Hailan</option>
            <option value="Rose">Rose</option>
            <option value="Lucas">Lucas</option>
            <option value="Outro">Outro</option>
          </select>
          <span class="select-arrow">▼</span>
        </div>
        <div id="responsavel_outro_field" style="display:none; margin-top:8px;">
          <div class="input-wrap">
            <span class="input-icon">✏️</span>
            <input id="responsavel_outro" type="text" placeholder="Digite o nome do responsável..." style="background:transparent;border:none;outline:none;color:var(--text);width:100%;padding:0 8px;font-size:15px;" />
          </div>
        </div>
      </div>

      <div class="field">
        <label for="setor">Setor</label>
        <div class="input-wrap">
          <span class="input-icon">🏢</span>
          <select id="setor" onchange="atualizarFuncionarios()">
            <option value="">Carregando setores...</option>
          </select>
          <span class="select-arrow">▼</span>
        </div>
      </div>

      <div class="field">
        <label for="funcionario">Funcionário</label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <select id="funcionario" disabled>
            <option value="">Selecione o setor primeiro...</option>
          </select>
          <span class="select-arrow">▼</span>
        </div>
      </div>

      <div class="hora-row">
        <div class="field">
          <label for="horario">Horário</label>
          <div class="input-wrap">
            <span class="input-icon">🕐</span>
            <input type="time" id="horario" />
          </div>
        </div>
        <button class="btn-agora" onclick="preencherAgora()" type="button">⚡ Agora</button>
      </div>

    </div>

    <div class="divider"></div>

    <div class="banner error"   id="bannerErro"></div>
    <div class="banner warning" id="bannerAviso"></div>

    <button class="btn-submit entrada" id="btnSubmit" onclick="enviar(event)">
      Registrar Entrada
    </button>

    <p class="tip" style="margin-top:14px;">
      O registro é salvo automaticamente na planilha do CETIPE.
    </p>

  </div>

  <div class="footer">CETIPE v3.0 &nbsp;·&nbsp; Colégio Padre Francisco</div>

  <!-- ── Overlay de sucesso ────────────────────────────── -->
  <div class="overlay" id="overlay">
    <div class="success-circle c-entrada" id="successCircle">✅</div>
    <div class="success-title"  id="successTitle">Registrado!</div>
    <div class="success-sub"    id="successSub"></div>
    <button class="btn-novo" onclick="novoRegistro()">Novo registro</button>
  </div>


  <script>
    // ── Cole aqui a URL do Apps Script após publicar ──────────
    var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLSQyLT4yBjNDne9iqll4-rAJe47ungYrufZyJscGjtBYrtZKEpiKB7W_1-_NtKra1/exec";
    var SENHA = "1567"; // mesma senha do backend.gs
    // ─────────────────────────────────────────────────────────

    var tipoAtual      = "entrada";
    var dadosPlanilha  = {};   // { setor: [nomes] } — carregado do Sheets

    // ── Init ──────────────────────────────────────────────────
    (function init() {
      atualizarDataBadge();
      preencherAgora();
      setInterval(atualizarDataBadge, 60000);
      carregarFuncionarios();
    })();

    function atualizarDataBadge() {
      var agora = new Date();
      var dias  = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
      var meses = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
      document.getElementById("dataBadge").textContent =
        dias[agora.getDay()] + ", " + agora.getDate() + " " +
        meses[agora.getMonth()] + " " + agora.getFullYear();
    }

    // ── Carrega funcionários via JSONP do Apps Script ────────────────
    function carregarFuncionarios() {
      if (!APPS_SCRIPT_URL) { ativarFallback(); return; }
      document.getElementById("setor").innerHTML = '<option value="">Carregando...</option>';

      var cb     = "_cbF" + Date.now();
      var script = document.createElement("script");
      var timer  = setTimeout(function() {
        window[cb] = null;
        if (script.parentNode) script.parentNode.removeChild(script);
        ativarFallback();
      }, 8000);

      window[cb] = function(data) {
        clearTimeout(timer);
        window[cb] = null;
        if (script.parentNode) script.parentNode.removeChild(script);
        if (data && data.funcionarios) {
          _preencherSetores(data.funcionarios);
        } else {
          ativarFallback();
        }
      };

      script.src = APPS_SCRIPT_URL +
        "?senha=" + encodeURIComponent(SENHA) +
        "&callback=" + cb;
      script.onerror = function() {
        clearTimeout(timer);
        window[cb] = null;
        ativarFallback();
      };
      document.head.appendChild(script);
    }

    function _preencherSetores(mapa) {
      dadosPlanilha = mapa;
      var sSelect = document.getElementById("setor");
      var setores = Object.keys(mapa).sort();
      sSelect.innerHTML = '<option value="">Selecione o setor...</option>';
      setores.forEach(function(s) {
        var o = document.createElement("option");
        o.value = o.textContent = s;
        sSelect.appendChild(o);
      });
    }

    // ── Fallback: campos de texto quando arquivo não existe ainda ──
    function ativarFallback() {
      dadosPlanilha = null;
      var inputStyle = "background:transparent;border:none;outline:none;" +
                       "color:var(--text);width:100%;padding:0 8px;font-size:15px;";

      document.getElementById("setor").outerHTML =
        '<input type="text" id="setor" autocomplete="off" ' +
        'placeholder="Digite o setor (ex: Cozinha)..." style="' + inputStyle + '" />';
      var sArr = document.getElementById("setor").parentElement.querySelector(".select-arrow");
      if (sArr) sArr.style.display = "none";

      document.getElementById("funcionario").outerHTML =
        '<input type="text" id="funcionario" autocomplete="off" ' +
        'placeholder="Digite o nome do funcionário..." style="' + inputStyle + '" />';
      document.getElementById("funcionario").disabled = false;
      var fArr = document.getElementById("funcionario").parentElement.querySelector(".select-arrow");
      if (fArr) fArr.style.display = "none";

      mostrarAviso("⚡ Modo manual: lista não carregada.");
    }

    // ── Atualiza dropdown de funcionários ─────────────────────
    function toggleResponsavelOutro() {
      var sel   = document.getElementById("responsavel").value;
      var campo = document.getElementById("responsavel_outro_field");
      if (campo) campo.style.display = sel === "Outro" ? "block" : "none";
    }

    function atualizarFuncionarios() {
      if (dadosPlanilha === null) return; // modo fallback — campos são texto livre
      var setor  = document.getElementById("setor").value;
      var select = document.getElementById("funcionario");
      esconderBanners();

      if (!setor) {
        select.innerHTML = '<option value="">Selecione o setor primeiro...</option>';
        select.disabled  = true;
        return;
      }

      var lista = dadosPlanilha[setor] || [];
      select.disabled  = false;
      select.innerHTML = '<option value="">Selecione o funcionário...</option>';

      lista.forEach(function(nome) {
        var o = document.createElement("option");
        o.value = o.textContent = nome;
        select.appendChild(o);
      });

      if (lista.length === 0) {
        select.innerHTML = '<option value="">Nenhum funcionário cadastrado</option>';
        select.disabled  = true;
      }
    }

    // ── Toggle Entrada / Saída ────────────────────────────────
    function setTipo(tipo) {
      tipoAtual = tipo;
      var bE  = document.getElementById("btnEntrada");
      var bS  = document.getElementById("btnSaida");
      var sub = document.getElementById("btnSubmit");
      esconderBanners();

      if (tipo === "entrada") {
        bE.className  = "toggle-btn active-entrada";
        bS.className  = "toggle-btn";
        sub.className = "btn-submit entrada";
        sub.textContent = "Registrar Entrada";
      } else {
        bS.className  = "toggle-btn active-saida";
        bE.className  = "toggle-btn";
        sub.className = "btn-submit saida";
        sub.textContent = "Registrar Saída";
      }
    }

    // ── Horário atual ─────────────────────────────────────────
    function preencherAgora() {
      var agora = new Date();
      var h = String(agora.getHours()).padStart(2,"0");
      var m = String(agora.getMinutes()).padStart(2,"0");
      document.getElementById("horario").value = h + ":" + m;
    }

    // ── Banners ───────────────────────────────────────────────
    function mostrarErro(msg) {
      var el = document.getElementById("bannerErro");
      el.textContent = "⚠️ " + msg;
      el.classList.add("show");
    }

    function mostrarAviso(msg) {
      var el = document.getElementById("bannerAviso");
      el.textContent = msg;
      el.classList.add("show");
    }

    function esconderBanners() {
      document.getElementById("bannerErro").classList.remove("show");
      document.getElementById("bannerAviso").classList.remove("show");
    }

    // ── Envio ─────────────────────────────────────────────────
    function enviar(event) {
      esconderBanners();

      var respSel     = document.getElementById("responsavel").value;
      var respOutro   = document.getElementById("responsavel_outro");
      var responsavel = (respSel === "Outro" && respOutro) ? respOutro.value.trim() : respSel;
      var setor       = document.getElementById("setor").value;
      var funcionario = document.getElementById("funcionario").value;
      var horario     = document.getElementById("horario").value;

      if (!responsavel || !setor || !funcionario || !horario) {
        mostrarErro("Preencha todos os campos antes de registrar.");
        return;
      }

      // Ripple no botão
      var btn  = document.getElementById("btnSubmit");
      var rect = btn.getBoundingClientRect();
      var rip  = document.createElement("span");
      var size = Math.max(rect.width, rect.height);
      rip.className = "ripple";
      rip.style.cssText = "width:" + size + "px;height:" + size + "px;" +
        "left:" + (event.clientX - rect.left - size/2) + "px;" +
        "top:"  + (event.clientY - rect.top  - size/2) + "px;";
      btn.appendChild(rip);
      setTimeout(function() { rip.remove(); }, 600);

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Registrando...';

      var dados = {
        tipo:        tipoAtual,
        responsavel: responsavel,
        setor:       setor,
        funcionario: funcionario,
        horario:     horario,
        senha:       SENHA,
      };

      if (!APPS_SCRIPT_URL) {
        setTimeout(function() { mostrarSucesso(dados); }, 700);
        return;
      }

      // Envia via fetch no-cors — funciona desktop e mobile
      var params = new URLSearchParams(dados).toString();
      fetch(APPS_SCRIPT_URL, {
        method:  "POST",
        mode:    "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body:    params,
      })
      .then(function() {
        mostrarSucesso(dados);
      })
      .catch(function() {
        // fetch falhou (comum em mobile com o redirecionamento do GAS) — usa form/iframe
        _enviarViaForm(btn, dados);
      });
    }

    // ── Fallback para mobile: POST via formulário em iframe oculto ───
    // fetch com no-cors falha em alguns browsers mobile por causa do redirect
    // interno do Google Apps Script. Um form POST tradicional não tem essa
    // restrição — o browser segue o redirect nativamente.
    function _enviarViaForm(btn, dados) {
      var iframe = document.getElementById("_pf");
      if (!iframe) {
        iframe = document.createElement("iframe");
        iframe.id = "_pf"; iframe.name = "_pf";
        iframe.style.cssText = "display:none;width:0;height:0;border:none;";
        document.body.appendChild(iframe);
      }
      var form = document.createElement("form");
      form.method = "POST";
      form.action = APPS_SCRIPT_URL;
      form.target = "_pf";
      form.style.display = "none";
      Object.keys(dados).forEach(function(k) {
        var inp = document.createElement("input");
        inp.type = "hidden"; inp.name = k; inp.value = dados[k];
        form.appendChild(inp);
      });
      document.body.appendChild(form);
      form.submit();
      setTimeout(function() {
        if (form.parentNode) form.parentNode.removeChild(form);
        mostrarSucesso(dados);
      }, 1500);
    }

    // ── Tela de sucesso ───────────────────────────────────────
    function mostrarSucesso(dados) {
      var isE     = dados.tipo === "entrada";
      var overlay = document.getElementById("overlay");
      var circle  = document.getElementById("successCircle");

      circle.className  = "success-circle " + (isE ? "c-entrada" : "c-saida");
      circle.textContent = isE ? "✅" : "🚪";

      document.getElementById("successTitle").textContent =
        isE ? "Entrada registrada!" : "Saída registrada!";

      document.getElementById("successSub").innerHTML =
        "<strong>" + dados.funcionario + "</strong><br>" +
        dados.setor + "<br>" +
        "Horário: <strong>" + dados.horario + "</strong><br><br>" +
        "<span style='font-size:12px;'>Registrado por " + dados.responsavel + "</span>";

      overlay.classList.add("show");
    }

    // ── Novo registro ─────────────────────────────────────────
    function novoRegistro() {
      document.getElementById("overlay").classList.remove("show");
      document.getElementById("responsavel").value = "";
      document.getElementById("setor").value       = "";
      document.getElementById("funcionario").innerHTML =
        '<option value="">Selecione o setor primeiro...</option>';
      document.getElementById("funcionario").disabled = true;

      var btn = document.getElementById("btnSubmit");
      btn.disabled = false;
      btn.textContent = tipoAtual === "entrada" ? "Registrar Entrada" : "Registrar Saída";

      preencherAgora();
      esconderBanners();
    }
  </script>

</body>
</html>
