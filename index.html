<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta http-equiv="refresh" content="3;url=https://app.sistemacetipe.com.br" />
  <title>CETIPE — Sistema atualizado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #1A3454, #0E1E32);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; color: #F0F6FF;
    }
    .card {
      max-width: 420px; text-align: center;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; padding: 36px 28px; backdrop-filter: blur(20px);
    }
    h1 { font-size: 20px; font-weight: 800; margin: 0 0 12px; }
    p { color: #8EAAC8; font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
    a.botao {
      display: block; text-decoration: none; background: linear-gradient(135deg, #1E3A5F, #2E6DA4);
      color: #fff; font-weight: 700; font-size: 14px; padding: 14px; border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Esse sistema foi substituído</h1>
    <p>O ponto e as ocorrências agora são registrados no novo sistema. Você vai ser redirecionado automaticamente em alguns segundos.</p>
    <a class="botao" href="https://app.sistemacetipe.com.br">Ir para o novo sistema</a>
  </div>
</body>
</html>
